<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="obsynx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D6"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="45" fill="#0B101E" stroke="url(#obsynx-grad)" stroke-width="4" />
  
  <!-- Hexagon Core -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" fill="#0056D6" fill-opacity="0.25" stroke="#00BFFF" stroke-width="2.5" />
  
  <!-- Diagonal Circuit Probe / Pulse Node -->
  <line x1="20" y1="80" x2="44" y2="56" stroke="#00BFFF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="20" cy="80" r="4" fill="#00BFFF" />
  <circle cx="50" cy="50" r="7" fill="#00BFFF" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3.5" fill="#FFFFFF" />
  
  <!-- Orbiting pulse accents -->
  <line x1="56" y1="44" x2="72" y2="28" stroke="#0056D6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,3" />
  <circle cx="72" cy="28" r="3" fill="#00BFFF" />
</svg>
