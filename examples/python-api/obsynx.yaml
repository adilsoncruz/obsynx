service:
  name: python-api
  runtime: python

instrumentation:
  automatic: true

  methods:
    - method: process_payment
      tracing: true
      metrics:
        - name: payments.processed.total
          type: counter
          value_from: "1"
          attributes_from:
            payment_status: "return.status"
          description: "Total de pagamentos por status retornado"
        - name: payments.amount.total
          type: counter
          unit: BRL
          value_from: "arg.1"
          attributes_from:
            payment_status: "return.status"
          description: "Soma do valor financeiro de entrada (arg.1 = amount) filtrado pelo status de saida (return.status)"
        - name: payments.processing.duration
          type: histogram
          unit: ms
          value_from: "duration_ms"
          description: "Duracao de execucao da funcao process_payment"
        - name: payments.in_flight
          type: updowncounter
          description: "Pagamentos em execucao simultanea"

    - method: calculate_customer_risk
      tracing: true
      metrics:
        - name: customer.risk.calculations.total
          type: counter
          value_from: "1"
          description: "Total de avaliacoes de risco executadas"
        - name: customer.risk.last_score
          type: gauge
          value_from: "return"
          description: "Ultimo score de risco retornado (return) pela funcao calculate_customer_risk"
